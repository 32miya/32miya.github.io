<!-- sekai-portal:begin（世界さんぽ入口へ戻るボタン・各名所共通。このブロックごと </body> の直前に貼る） -->
<style>
.sekai-back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:2px;padding:9px 14px;border:1px solid rgba(201,163,92,.45);border-radius:10px;
  color:#ece6da;text-decoration:none;font-size:13px;letter-spacing:.08em;background:rgba(12,15,20,.6)}
.sekai-back::before{content:"‹";font-size:18px;line-height:0;margin-top:-2px}
.sekai-back:active{transform:scale(.98)}
#menu .sekai-back{align-self:stretch;justify-content:center;margin-top:0}
</style>
<script>
(function(){
  var DEFAULT_PORTAL = "https://32miya.github.io/sekai/";
  var portal = DEFAULT_PORTAL;
  try{ var v = localStorage.getItem("sekaiSanpo.portal"); if(v){ v = JSON.parse(v); if(/^https?:\/\//.test(v)) portal = v; } }catch(e){}
  function make(){ var a=document.createElement("a"); a.className="sekai-back"; a.href=portal; a.textContent="世界さんぽへ戻る"; return a; }
  var go = document.getElementById("goBtn");
  if(go && go.parentNode) go.parentNode.insertBefore(make(), go.nextSibling);
  var menu = document.getElementById("menu");
  if(menu) menu.appendChild(make());
})();
</script>
<!-- sekai-portal:end -->
